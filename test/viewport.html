<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body><pre id="out"></pre>
<script>
  function report() {
    document.getElementById('out').textContent =
      'innerWidth=' + window.innerWidth +
      '\ninnerHeight=' + window.innerHeight +
      '\nclientWidth=' + document.documentElement.clientWidth +
      '\nclientHeight=' + document.documentElement.clientHeight +
      '\ndevicePixelRatio=' + window.devicePixelRatio +
      '\nscreen=' + screen.width + 'x' + screen.height +
      '\navail=' + screen.availWidth + 'x' + screen.availHeight;
  }
  report();
  window.addEventListener('resize', report);
</script>
</body>
</html>
